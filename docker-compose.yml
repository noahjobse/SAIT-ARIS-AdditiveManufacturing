version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./models:/app/models
      - /app/frontend/node_modules
    environment:
      - PYTHONUNBUFFERED=1
      - PYBULLET_THREADS=4
      - WEB_WORKERS=2
