# Demo docker-compose — full pipeline: backend (FastAPI/PyBullet) + frontend (Vite legacy)
# Usage: docker compose -f docker-compose.demo.yml up --build
# Backend API:  http://localhost:8001/docs
# Frontend:     http://localhost:5174
# Note: Uses demo-frontend/ (Vite app) for the automated Playwright demo.
#       The main frontend/ is the Next.js app under active development.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./models:/models
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./demo-frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5173"
    volumes:
      - ./demo-frontend/src:/app/src
      - ./demo-frontend/public:/app/public
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
