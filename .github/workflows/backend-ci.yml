name: Backend CI

on:
  push:
    branches: [ noah, jason, dylane, umaya ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, backend ]
    paths:
      - 'backend/**'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Lint with ruff
      run: uvx ruff@0.14.14 check backend/

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Cache venv
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-py3.12-venv-${{ hashFiles('backend/requirements.txt') }}

    - name: Install dependencies
      run: |
        cd backend
        uv venv .venv
        uv pip install -r requirements.txt

    - name: Run tests
      run: |
        cd backend
        .venv/bin/python -m pytest tests/ -v
