[tool.poetry]
name = "abb-sim-backend"
version = "0.1.0"
description = "ABB Robot Simulation Backend - FastAPI + PyBullet"
authors = ["SAIT Research Applications <noreply@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.109.0"
uvicorn = {extras = ["standard"], version = "0.25.0"}
python-multipart = "0.0.6"
pybullet = "3.2.6"
numpy = ">=1.24.0"
scipy = ">=1.13.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "0.23.3"
httpx = "0.26.0"
ruff = "0.1.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
